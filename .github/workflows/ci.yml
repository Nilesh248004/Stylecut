name: Stylecut CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Install client frontend dependencies
        run: npm ci --prefix client-frontend

      - name: Install barber frontend dependencies
        run: npm ci --prefix barber-frontend

      - name: Build project
        run: npm run build

      - name: Build Docker image
        run: docker build -t stylecut .